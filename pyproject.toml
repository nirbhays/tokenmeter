[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenmeter"
version = "0.1.0"
description = "Know exactly what you spend on AI — LLM API Cost Tracker & Smart Router."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "TokenMeter", email = "hello@tokenmeter.dev" },
]
keywords = [
    "llm", "ai", "cost", "tracking", "router", "openai", "anthropic",
    "google", "proxy", "budget", "analytics", "mlops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://tokenmeter.dev"
Documentation = "https://tokenmeter.dev/docs"
Repository = "https://github.com/tokenmeter/tokenmeter"
"Bug Tracker" = "https://github.com/tokenmeter/tokenmeter/issues"
Changelog = "https://github.com/tokenmeter/tokenmeter/blob/main/CHANGELOG.md"

# =============================================================================
# Tool Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that require external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]

# ---------------------------------------------------------------------------
# ruff (linter + formatter — replaces flake8 + isort + black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "T20",  # flake8-print
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "RET504", # unnecessary-assign (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "T20",    # allow print in tests
    "S101",   # allow assert in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (type checker)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "stripe.*",
    "tiktoken.*",
    "asyncpg.*",
    "aiochclient.*",
    "aiosmtplib.*",
    "orjson.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]
show_missing = true
skip_covered = true
fail_under = 60
